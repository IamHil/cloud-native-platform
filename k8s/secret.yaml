apiVersion: v1

kind: Secret

metadata:
  name: cloud-native-secret
  namespace: cloud-native

type: Opaque

stringData:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  # Must be >= 16 chars and not a weak default (see app.core.config)
  JWT_SECRET_KEY: local-dev-jwt-secret-change-me
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8000,http://cloud-native.local"
  RATE_LIMIT: "60/minute"