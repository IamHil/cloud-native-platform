name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python package
        run: python -m compileall -q app

      - name: Note on AWS
        run: |
          echo "CI does not create AWS resources."
          echo "LocalStack Terraform apply is a local developer step only."
          echo "infrastructure/terraform-aws-prod must NEVER be applied from CI."
