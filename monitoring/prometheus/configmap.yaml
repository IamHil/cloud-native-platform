apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloud-native
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: cloud-native-api
        metrics_path: /metrics
        static_configs:
          - targets: ["cloud-native-api:8000"]

  alerts.yml: |
    groups:
      - name: cloud-native-api
        rules:
          - alert: ApiHighErrorRate
            expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: API returning 5xx errors
              description: cloud-native-api has server errors in the last 5 minutes.
