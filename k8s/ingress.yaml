apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-native-api
  namespace: cloud-native
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: cloud-native.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-native-api
                port:
                  number: 8000
